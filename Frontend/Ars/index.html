<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000012" />
    <title>CHILD/REN of the BLOOM — Ars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css?v=20260904-1" />
    <script src="./js/vendor/p5.min.js"></script>
  </head>
  <body>
    <div id="kiosk">
      <video
        id="loop-video"
        class="loop-video"
        playsinline
        muted
        loop
        preload="auto"
        aria-hidden="true"
      ></video>
      <main id="stage"></main>
      <div id="ui"></div>
    </div>
    <div id="kiosk-lock" class="kiosk-lock" hidden>
      <form class="kiosk-lock__panel" id="kiosk-lock-form" autocomplete="off">
        <h2 class="kiosk-lock__title">Staff unlock</h2>
        <p class="kiosk-lock__copy">
          Enter the exit password to leave fullscreen.
        </p>
        <label class="kiosk-lock__label" for="kiosk-lock-password">Password</label>
        <input
          id="kiosk-lock-password"
          class="kiosk-lock__input"
          type="password"
          name="kiosk-password"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="kiosk-lock-error" class="kiosk-lock__error" hidden>
          Incorrect password
        </p>
        <div class="kiosk-lock__actions">
          <button type="submit" class="btn btn--medium">Unlock</button>
          <button type="button" class="btn btn--ghost" id="kiosk-lock-return">
            Return to kiosk
          </button>
        </div>
      </form>
    </div>
    <script src="./js/sketch.js"></script>
    <script src="./js/api.js?v=20260903-1"></script>
    <script src="./js/prayer-lines.js?v=20260903-2"></script>
    <script src="./js/app.js?v=20260904-3"></script>
  </body>
</html>
