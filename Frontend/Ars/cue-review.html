<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Cue editor for timed prayer lines.
      Requires ars_server.py for Save → PUT /api/loops.
      Preview viewport must stay 688×1032 so wraps match the kiosk (prayer-lines.js).
    -->
    <title>Prayer cue editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;1,400&family=Montserrat:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #141b2f;
        --line: #2a3555;
        --text: #e8eefc;
        --muted: #9aa8c7;
        --accent: #77f1e2;
        --warn: #ffb454;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.45 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        height: 100vh;
      }
      header {
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: end;
        justify-content: space-between;
      }
      header h1 { margin: 0 0 0.2rem; font-size: 1.1rem; }
      header p { margin: 0; color: var(--muted); max-width: 40rem; font-size: 13px; }
      .header-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem 1.25rem;
        align-items: end;
      }
      label { display: grid; gap: 0.25rem; color: var(--muted); font-size: 12px; }
      .width-control { min-width: 13rem; }
      .width-control input[type="range"] { width: 100%; }
      .width-readout {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        font-size: 12px;
      }
      select, button, textarea, input {
        font: inherit;
        color: var(--text);
        background: #0d1426;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      select, button { padding: 0.4rem 0.7rem; cursor: pointer; }
      button.primary {
        background: rgba(119, 241, 226, 0.16);
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        cursor: default;
        opacity: 0.48;
      }
      button.saving {
        cursor: wait;
        opacity: 0.75;
      }
      button.danger { border-color: var(--danger); color: var(--danger); }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(300px, 420px);
        gap: 0.75rem;
        padding: 0.75rem;
        height: calc(100vh - 5.5rem);
      }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; height: auto; overflow: auto; }
        body { overflow: auto; height: auto; }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel h2 {
        margin: 0;
        padding: 0.65rem 0.85rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .editor-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.65rem 0.85rem;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 2rem 4.5rem 4.5rem 1fr auto;
        gap: 0.35rem;
        align-items: start;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--line);
      }
      .row.active {
        background: rgba(119, 241, 226, 0.08);
        outline: 1px solid rgba(119, 241, 226, 0.35);
      }
      .row.wrap-cont { border-left: 3px solid var(--warn); }
      .row .num {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        padding-top: 0.4rem;
        font-size: 12px;
      }
      .row input[data-field="start"],
      .row input[data-field="end"] {
        width: 100%;
        padding: 0.28rem 0.32rem;
        font-variant-numeric: tabular-nums;
      }
      .row textarea {
        width: 100%;
        min-height: 2.3rem;
        resize: vertical;
        padding: 0.32rem 0.42rem;
        line-height: 1.35;
        font-family: "Bona Nova", Georgia, serif;
      }
      .row-meta {
        grid-column: 2 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.65rem;
        font-size: 11px;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 0.08rem 0.38rem;
        border-radius: 999px;
        border: 1px solid var(--line);
      }
      .badge.warn { border-color: var(--warn); color: var(--warn); }
      .badge.ok { border-color: var(--accent); color: var(--accent); }
      .row-actions { display: grid; gap: 0.2rem; }
      .row-actions button { padding: 0.18rem 0.4rem; font-size: 11px; }
      .hint { color: var(--muted); margin: 0; padding: 0.5rem 0.85rem; font-size: 12px; }
      .status-ok { color: var(--accent); }
      .status-err { color: var(--danger); }

      /* Kiosk preview — same structure as index.html */
      .kiosk-panel { align-items: stretch; }
      .kiosk-shell {
        flex: 1;
        position: relative;
        padding: 0.5rem;
        min-height: 0;
        background: #000008;
        overflow: hidden;
      }
      #kiosk {
        /* Render at the app's logical viewport size, then scale the complete
           kiosk into this panel. CSS scaling does not alter line wrapping. */
        position: absolute !important;
        width: 688px;
        height: 1032px;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) scale(var(--preview-scale, 0.5));
        transform-origin: center;
        overflow: hidden;
        background: var(--ink);
      }
      #kiosk .loop-video {
        opacity: 1;
        pointer-events: auto;
      }
      #kiosk .screen {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      #kiosk .screen-body {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .kiosk-controls {
        flex-shrink: 0;
        width: 100%;
        max-width: 390px;
        padding: 0.5rem 0;
      }
      .kiosk-controls video {
        width: 100%;
        border-radius: 6px;
        background: #000;
      }
      .now {
        margin: 0.35rem 0;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Prayer cue editor</h1>
        <p>
          Preview uses the same kiosk layout and line expansion as the app.
          Each row is one on-screen carousel line; edit text and appear timing
          together while watching the real overlay.
        </p>
      </div>
      <div class="header-controls">
        <label class="width-control">
          Line width
          <input id="wrap-fraction" type="range" min="32" max="72" step="1" value="48" />
          <span class="width-readout" id="width-readout">48%</span>
        </label>
        <label>
          Loop
          <select id="loop-select"></select>
        </label>
      </div>
    </header>
    <main>
      <section class="panel">
        <h2>Lines (<span id="cue-count">0</span>)</h2>
        <div class="toolbar">
          <button type="button" id="set-start">Start = now</button>
          <button type="button" id="set-end">End = now</button>
          <button type="button" id="nudge-back">−0.1s</button>
          <button type="button" id="nudge-fwd">+0.1s</button>
          <button type="button" id="add-cue">Add</button>
          <button type="button" id="rewrap">Re-wrap</button>
          <button type="button" id="save" disabled>Save</button>
        </div>
        <p class="hint" id="status">Loading…</p>
        <div class="editor-scroll" id="cues"></div>
      </section>

      <section class="panel kiosk-panel">
        <h2>App preview</h2>
        <div class="kiosk-shell">
          <div id="kiosk">
            <video
              id="video"
              class="loop-video is-active"
              playsinline
              controls
              preload="metadata"
            ></video>
            <section class="screen screen--prayer screen--poem">
              <p class="screen-header screen-header--poem">A child's prayer</p>
              <div class="screen-body">
                <div class="poem-carousel" id="poem">
                  <div class="poem-stack" id="poem-stack"></div>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div class="kiosk-controls">
          <p class="now">t = <span id="clock">0.00</span>s</p>
        </div>
      </section>
    </main>
    <script src="./js/prayer-lines.js?v=20260903-2"></script>
    <script>
      const kiosk = document.getElementById("kiosk");
      const video = document.getElementById("video");
      const clock = document.getElementById("clock");
      const cuesEl = document.getElementById("cues");
      const status = document.getElementById("status");
      const loopSelect = document.getElementById("loop-select");
      const cueCount = document.getElementById("cue-count");
      const poemStack = document.getElementById("poem-stack");
      const wrapFractionInput = document.getElementById("wrap-fraction");
      const widthReadout = document.getElementById("width-readout");
      const kioskShell = document.querySelector(".kiosk-shell");
      const saveButton = document.getElementById("save");

      const MAX_NEIGHBOR = 5;
      // Same canonical logical viewport as sketch.js and the source videos.
      // Must match sketch.js KIOSK_* and source video resolution or wraps diverge.
      const APP_VIEWPORT_WIDTH = 688;
      const APP_VIEWPORT_HEIGHT = 1032;

      let payload = null;
      let loopIndex = 0;
      let sourceCues = [];
      let cues = [];
      let readingLines = [];
      let readingStarts = [];
      let cueIndexForLine = [];
      let selected = 0;
      let loadedOnce = false;
      let wrapFraction = 0.48;
      let rewrapTimer = null;
      let statusTimer = null;
      let dirty = false;
      let saving = false;

      function setStatus(message, className = "", clearAfter = 0) {
        clearTimeout(statusTimer);
        status.textContent = message;
        status.className = `hint${className ? ` ${className}` : ""}`;
        if (clearAfter > 0) {
          statusTimer = setTimeout(() => {
            status.textContent = "";
            status.className = "hint";
          }, clearAfter);
        }
      }

      function updateSaveButton(label) {
        saveButton.textContent = label || (dirty ? "Save changes" : "Save");
        saveButton.disabled = saving || !dirty;
        saveButton.classList.toggle("primary", dirty && !saving);
        saveButton.classList.toggle("saving", saving);
      }

      function markDirty() {
        dirty = true;
        updateSaveButton();
      }

      /** Same logical viewport for wrapping regardless of editor panel size. */
      function kioskViewport() {
        const loop = currentLoop();
        return {
          width: APP_VIEWPORT_WIDTH,
          height: APP_VIEWPORT_HEIGHT,
          wrapFraction,
          wrapMode: (loop && loop.wrapMode) || "width",
        };
      }

      function layoutKioskPreview() {
        const availableWidth = Math.max(1, kioskShell.clientWidth - 16);
        const availableHeight = Math.max(1, kioskShell.clientHeight - 16);
        const scale = Math.min(
          availableWidth / APP_VIEWPORT_WIDTH,
          availableHeight / APP_VIEWPORT_HEIGHT
        );
        kiosk.style.setProperty("--preview-scale", String(scale));
      }

      function fmt(n) {
        return Number(n || 0).toFixed(2);
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function currentLoop() {
        return payload?.loops?.[loopIndex] || null;
      }

      function updateWidthReadout() {
        const m = PrayerLines.getPrayerLineMetrics(kioskViewport());
        const mode = kioskViewport().wrapMode;
        widthReadout.textContent = `${Math.round(m.wrapFraction * 100)}% · ${Math.round(
          m.maxWidth
        )}px · ${mode === "punctuation" ? "punctuation-first" : "width"} · app ${APP_VIEWPORT_WIDTH}×${APP_VIEWPORT_HEIGHT}`;
      }

      function expandFromSource(source) {
        const expanded = PrayerLines.expandCuesToReadingLines(
          source || [],
          kioskViewport()
        );
        readingLines = expanded.lines;
        readingStarts = expanded.starts;
        cueIndexForLine = expanded.cueIndexForLine || [];
        const merged = expanded.mergedCues || source || [];
        cues = readingLines.map((text, i) => {
          const parentIdx = cueIndexForLine[i];
          const parent = merged[parentIdx] || {};
          const end =
            i + 1 < readingStarts.length
              ? readingStarts[i + 1]
              : Number(parent.end) || readingStarts[i] + 1.5;
          return {
            text,
            start: Math.round(readingStarts[i] * 100) / 100,
            end: Math.round(end * 100) / 100,
            nowrap: true,
            _wrapCont: i > 0 && cueIndexForLine[i] === cueIndexForLine[i - 1],
            _parentIdx: parentIdx,
          };
        });
        return cues;
      }

      function syncReadingFromCues() {
        readingLines = cues.map((c) => c.text);
        readingStarts = cues.map((c) => Number(c.start) || 0);
      }

      function syncPrayerFromCues() {
        // Persist one cue per editor row. nowrap keeps coalesceAudioCues from
        // merging lowercase continuations (e.g. "going…") back into the prior line.
        const loop = currentLoop();
        if (!loop || !loadedOnce) return;
        loop.audioCues = cues.map(({ text, start, end, nowrap, wordStarts, wordTiming }) => {
          const cue = {
            text: String(text || "").trim(),
            start: Number(start) || 0,
            end: Number(end) || 0,
            nowrap: true,
          };
          if (wordStarts) cue.wordStarts = wordStarts;
          if (Array.isArray(wordTiming)) cue.wordTiming = wordTiming;
          return cue;
        });
        loop.prayer = loop.audioCues.map((c) => c.text).filter(Boolean).join("\n");
        loop.audioSync = true;
        loop.wrapFraction = wrapFraction;
        payload.wrapFraction = wrapFraction;
        sourceCues = loop.audioCues.map((c) => ({ ...c }));
      }

      function poemLineHTML(text, className, slot) {
        return `<p class="poem-line poem-line--section ${className}" data-slot="${slot}"><span class="poem-line-text">${escapeHtml(
          text
        )}</span></p>`;
      }

      function buildPoemStackHTML(activeIndex) {
        const lines = readingLines;
        if (!lines.length) return "";
        let html = "";
        const pastStart = Math.max(0, activeIndex - MAX_NEIGHBOR);
        for (let i = pastStart; i < activeIndex; i += 1) {
          html += poemLineHTML(lines[i], "poem-line--past", activeIndex - i);
        }
        html += poemLineHTML(lines[activeIndex] || "", "poem-line--current", 0);
        // During the app's first audio-synced reading, future lines are hidden.
        // Cue review mirrors that state instead of showing upcoming text early.
        return html;
      }

      function activeLineAt(t) {
        let active = 0;
        let last = -Infinity;
        for (let i = 0; i < readingStarts.length; i += 1) {
          const s = Number(readingStarts[i]);
          if (!Number.isFinite(s)) continue;
          if (s + 0.05 < last) continue;
          if (t + 0.08 >= s) {
            active = i;
            last = s;
          }
        }
        return active;
      }

      function renderPreview(t) {
        syncReadingFromCues();
        const active = activeLineAt(t);
        poemStack.innerHTML = readingLines.length
          ? buildPoemStackHTML(active)
          : `<p class="hint" style="color:#fff;text-align:center;padding:2rem">No lines</p>`;
      }

      function renderCues() {
        cueCount.textContent = String(cues.length);
        const { maxWidth, font } = PrayerLines.getPrayerLineMetrics(kioskViewport());
        cuesEl.innerHTML = cues
          .map((cue, i) => {
            const text = cue.text || "";
            const measured = PrayerLines.measureTextWidth(text, font);
            const overflow = measured > maxWidth + 1;
            return `<div class="row ${i === selected ? "active" : ""} ${
              cue._wrapCont ? "wrap-cont" : ""
            }" data-index="${i}">
              <div class="num">${i + 1}</div>
              <input type="text" inputmode="decimal" data-field="start" value="${fmt(cue.start)}" title="appears at — select and replace the full number" />
              <input type="text" inputmode="decimal" data-field="end" value="${fmt(cue.end)}" title="end — select and replace the full number" />
              <textarea data-field="text">${escapeHtml(text)}</textarea>
              <div class="row-actions">
                <button type="button" data-act="play">▶</button>
                <button type="button" data-act="split">Split</button>
                <button type="button" data-act="merge">Merge↓</button>
                <button type="button" data-act="del" class="danger">Del</button>
              </div>
              <div class="row-meta">
                <span>appears @ ${fmt(cue.start)}s</span>
                ${
                  cue._wrapCont
                    ? `<span class="badge warn">wrap continuation</span>`
                    : `<span class="badge ok">line start</span>`
                }
                ${
                  overflow
                    ? `<span class="badge warn">${Math.round(measured)}px &gt; ${Math.round(maxWidth)}px</span>`
                    : `<span>${Math.round(measured)}px</span>`
                }
              </div>
            </div>`;
          })
          .join("");
      }

      function renderLoopOptions() {
        loopSelect.innerHTML = (payload.loops || [])
          .map((loop, i) => {
            const label = `${i + 1}. ${loop.videoKey || loop.video || "loop"}`;
            return `<option value="${i}">${escapeHtml(label)}</option>`;
          })
          .join("");
        loopSelect.value = String(loopIndex);
      }

      function applyExpansion(source, { announce = true } = {}) {
        const before = cues.length;
        expandFromSource(source);
        selected = Math.min(selected, Math.max(0, cues.length - 1));
        renderCues();
        renderPreview(video.currentTime || Number(cues[selected]?.start) || 0);
        updateWidthReadout();
        if (announce) {
          setStatus(
            before === cues.length
              ? `${cues.length} lines · width ${Math.round(wrapFraction * 100)}%`
              : `${before} → ${cues.length} lines · width ${Math.round(wrapFraction * 100)}%`,
            "status-ok"
          );
        }
      }

      function loadLoop(index, { persistPrevious = true } = {}) {
        if (persistPrevious && loadedOnce) syncPrayerFromCues();
        loopIndex = index;
        const loop = currentLoop();
        if (!loop) return;

        wrapFraction =
          Number(loop.wrapFraction) || Number(payload.wrapFraction) || 0.48;
        wrapFractionInput.value = String(Math.round(wrapFraction * 100));

        sourceCues = Array.isArray(loop.audioCues)
          ? loop.audioCues.map((c) => ({ ...c }))
          : [];
        if (!sourceCues.length) {
          const prayerLines = String(loop.prayer || "")
            .split(/\n+/)
            .map((l) => l.trim())
            .filter(Boolean);
          sourceCues = prayerLines.length
            ? prayerLines.map((text, i) => ({
                text,
                start: i * 2,
                end: i * 2 + 1.8,
              }))
            : [{ text: "", start: 0, end: 2 }];
        }

        selected = 0;
        const src = `./assets/videos/${loop.video || ""}`;
        if (video.getAttribute("src") !== src) {
          video.src = src;
          video.load();
        }
        loadedOnce = true;

        requestAnimationFrame(() => {
          layoutKioskPreview();
          applyExpansion(sourceCues, { announce: true });
          setStatus(`${cues.length} lines · ${loop.video || ""}`);
        });
      }

      function highlight() {
        const t = video.currentTime;
        clock.textContent = fmt(t);
        const active = activeLineAt(t);
        if (active !== selected) {
          selected = active;
          [...cuesEl.querySelectorAll(".row")].forEach((row, i) => {
            row.classList.toggle("active", i === active);
          });
        }
        renderPreview(t);
      }

      async function boot() {
        let data = null;
        try {
          const api = await fetch("/api/loops", { cache: "no-store" });
          if (api.ok) data = await api.json();
        } catch (_) {}
        if (!data) {
          const res = await fetch("./assets/docs/loops.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`loops.json ${res.status}`);
          data = await res.json();
        }
        payload = data;
        wrapFraction = Number(data.wrapFraction) || 0.48;
        wrapFractionInput.value = String(Math.round(wrapFraction * 100));
        renderLoopOptions();
        loadLoop(0, { persistPrevious: false });
        dirty = false;
        updateSaveButton();
      }

      loopSelect.addEventListener("change", () => {
        loadLoop(Number(loopSelect.value) || 0);
      });

      wrapFractionInput.addEventListener("input", () => {
        wrapFraction = Number(wrapFractionInput.value) / 100;
        markDirty();
        updateWidthReadout();
        clearTimeout(rewrapTimer);
        rewrapTimer = setTimeout(() => {
          const stripped = sourceCues.map((c) => {
            const copy = { ...c };
            delete copy.nowrap;
            return copy;
          });
          applyExpansion(stripped);
        }, 180);
      });

      cuesEl.addEventListener("input", (event) => {
        const target = event.target;
        const row = target.closest(".row");
        if (!row || !target.dataset.field) return;
        const index = Number(row.dataset.index);
        const field = target.dataset.field;
        if (field === "text") {
          cues[index][field] = target.value;
          delete cues[index].wordTiming;
        } else {
          // Plain decimal text permits replacing the entire value, including
          // the whole-number portion (for example 2.44 → 2.01).
          const value = Number(target.value.trim());
          if (!Number.isFinite(value)) return;
          cues[index][field] = value;
        }
        markDirty();
        selected = index;
        syncReadingFromCues();
        // Re-evaluate the line at the actual playhead, including t=0.
        renderPreview(Number(video.currentTime) || 0);
        [...cuesEl.querySelectorAll(".row")].forEach((r, i) => {
          r.classList.toggle("active", i === index);
        });

        // Update the existing row without replacing its focused input.
        const appears = row.querySelector(".row-meta span");
        if (appears) appears.textContent = `appears @ ${fmt(cues[index].start)}s`;
      });

      cuesEl.addEventListener("change", (event) => {
        const target = event.target;
        if (
          !(target instanceof HTMLInputElement) ||
          (target.dataset.field !== "start" && target.dataset.field !== "end")
        ) {
          return;
        }
        const row = target.closest(".row");
        const cue = row ? cues[Number(row.dataset.index)] : null;
        if (!cue) return;
        const value = Number(target.value.trim());
        target.value = fmt(Number.isFinite(value) ? value : cue[target.dataset.field]);
        syncReadingFromCues();
        renderPreview(Number(video.currentTime) || 0);
      });

      cuesEl.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-act]");
        const row = event.target.closest(".row");
        if (!row) return;
        const index = Number(row.dataset.index);
        selected = index;

        if (!btn) {
          [...cuesEl.querySelectorAll(".row")].forEach((r, i) => {
            r.classList.toggle("active", i === index);
          });
          renderPreview(Number(cues[index].start) || 0);
          return;
        }

        const act = btn.dataset.act;
        if (act === "play") {
          video.currentTime = Number(cues[index].start) || 0;
          video.play();
        } else if (act === "del") {
          if (cues.length <= 1) return;
          cues.splice(index, 1);
          selected = Math.max(0, index - 1);
        } else if (act === "merge") {
          if (index >= cues.length - 1) return;
          const a = cues[index];
          const b = cues[index + 1];
          a.text = `${String(a.text || "").trim()} ${String(b.text || "").trim()}`.trim();
          a.end = b.end;
          a._wrapCont = false;
          cues.splice(index + 1, 1);
        } else if (act === "split") {
          const cue = cues[index];
          const text = String(cue.text || "");
          const mid = Math.floor(text.length / 2);
          let cut = text.indexOf(" ", mid);
          if (cut < 0) cut = text.lastIndexOf(" ", mid);
          if (cut < 1) return;
          const left = text.slice(0, cut).trim();
          const right = text.slice(cut).trim();
          if (!left || !right) return;
          const start = Number(cue.start) || 0;
          const end = Number(cue.end) || start + 2;
          const lw = left.split(/\s+/).filter(Boolean).length;
          const tw = text.split(/\s+/).filter(Boolean).length || 1;
          const midT = start + (end - start) * (lw / tw);
          cues.splice(
            index,
            1,
            { text: left, start, end: midT, nowrap: true, _wrapCont: cue._wrapCont },
            { text: right, start: midT, end, nowrap: true, _wrapCont: true }
          );
        }
        if (act !== "play") markDirty();
        syncReadingFromCues();
        renderCues();
        renderPreview(video.currentTime || Number(cues[selected]?.start) || 0);
      });

      cuesEl.addEventListener("focusin", (event) => {
        const target = event.target;
        if (
          target instanceof HTMLInputElement &&
          (target.dataset.field === "start" || target.dataset.field === "end")
        ) {
          // A single click prepares the complete timing value for replacement.
          requestAnimationFrame(() => target.select());
        }
      });

      document.getElementById("set-start").addEventListener("click", () => {
        if (!cues[selected]) return;
        cues[selected].start = Number(video.currentTime.toFixed(2));
        markDirty();
        syncReadingFromCues();
        renderCues();
        renderPreview(cues[selected].start);
      });
      document.getElementById("set-end").addEventListener("click", () => {
        if (!cues[selected]) return;
        cues[selected].end = Number(video.currentTime.toFixed(2));
        markDirty();
        renderCues();
      });
      document.getElementById("nudge-back").addEventListener("click", () => {
        if (!cues[selected]) return;
        cues[selected].start = Number((Number(cues[selected].start) - 0.1).toFixed(2));
        markDirty();
        syncReadingFromCues();
        renderCues();
        renderPreview(cues[selected].start);
      });
      document.getElementById("nudge-fwd").addEventListener("click", () => {
        if (!cues[selected]) return;
        cues[selected].start = Number((Number(cues[selected].start) + 0.1).toFixed(2));
        markDirty();
        syncReadingFromCues();
        renderCues();
        renderPreview(cues[selected].start);
      });
      document.getElementById("add-cue").addEventListener("click", () => {
        const prev = cues[selected] || { start: 0, end: 1 };
        cues.splice(selected + 1, 0, {
          text: "",
          start: Number(prev.end) || 0,
          end: (Number(prev.end) || 0) + 2,
          nowrap: true,
        });
        selected += 1;
        markDirty();
        syncReadingFromCues();
        renderCues();
      });
      document.getElementById("rewrap").addEventListener("click", () => {
        const stripped = cues.map((c) => {
          const copy = { ...c };
          delete copy.nowrap;
          delete copy._wrapCont;
          delete copy._parentIdx;
          return copy;
        });
        sourceCues = stripped;
        markDirty();
        applyExpansion(stripped);
      });
      saveButton.addEventListener("click", async () => {
        if (!dirty || saving) return;
        syncPrayerFromCues();
        const body = JSON.stringify(payload, null, 2);
        saving = true;
        updateSaveButton("Saving…");
        setStatus("Saving changes…");
        try {
          const res = await fetch("/api/loops", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body,
          });
          if (!res.ok) throw new Error(`Save failed (${res.status})`);
          dirty = false;
          saving = false;
          updateSaveButton("Saved ✓");
          setStatus("Saved to loops.json.", "status-ok", 1800);
          setTimeout(() => updateSaveButton(), 1200);
        } catch (err) {
          saving = false;
          updateSaveButton();
          setStatus(`Save failed: ${err.message}`, "status-err");
        }
      });

      window.addEventListener("beforeunload", (event) => {
        if (!dirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      video.addEventListener("timeupdate", highlight);
      video.addEventListener("loadedmetadata", () => {
        layoutKioskPreview();
      });
      window.addEventListener("resize", () => {
        layoutKioskPreview();
        updateWidthReadout();
      });

      boot().catch((err) => {
        setStatus(`Failed to load: ${err.message}`, "status-err");
      });
    </script>
  </body>
</html>
